name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      # vinext 的预渲染器不支持 basePath，会因请求 / 得到 404 而跳过主页；
      # 起生产服务器直接抓取 /pku-gpa-ink/ 的完整 HTML 补成 index.html。
      - name: Render index.html under basePath
        run: |
          npx wrangler dev --config dist/server/wrangler.json --port 8787 &
          WRANGLER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8787/pku-gpa-ink/ -o dist/client/index.html && break
            sleep 1
          done
          kill "$WRANGLER_PID" 2>/dev/null || true
          test -s dist/client/index.html
          grep -q "/pku-gpa-ink/_next" dist/client/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
